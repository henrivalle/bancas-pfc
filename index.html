<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bancas de PFC 2026/2</title><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef0f7;color:#1b1a3a}
.top{background:linear-gradient(135deg,#1f1e5c,#4b48b8);color:#fff;padding:18px 16px 16px}.top small{opacity:.8;letter-spacing:1px;font-weight:700;font-size:11px;text-transform:uppercase}.top h1{margin:4px 0 0;font-size:22px}
.wrap{padding:14px;max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(30,30,90,.08)}
.banca{display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid transparent}.banca.now{border-color:#ffc94a;background:#fffbea}
.hora{font-weight:900;color:#2e2d6e;font-size:18px;min-width:62px}.g{font-weight:800;font-size:16px}.s{color:#666;font-size:13px;margin-top:2px}
.tag{display:inline-block;background:#ffc94a;color:#2e2d6e;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px}
.ok{display:inline-block;background:#dcf5e3;color:#167a3e;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px}
h2{font-size:17px;margin:4px 0 10px;color:#2e2d6e}h3{font-size:15px;margin:0 0 8px}
.crit{margin:12px 0}.crit .l{font-weight:700;font-size:14px;margin-bottom:6px}.crit .l span{color:#888;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.opts button{border:2px solid #d8d8e8;background:#fff;border-radius:10px;padding:10px 2px;font-size:12.5px;font-weight:700;color:#444}
.opts button.on{color:#fff;border-color:transparent}.opts button.on.I{background:#c62828}.opts button.on.R{background:#e0703a}.opts button.on.B{background:#0f9d8a}.opts button.on.E{background:#2e2d6e}
.rec{display:grid;grid-template-columns:1fr;gap:6px}.rec button{border:2px solid #d8d8e8;background:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:700;text-align:left}.rec button.on{background:#2e2d6e;color:#fff;border-color:#2e2d6e}
input,textarea{width:100%;font-size:17px;padding:12px;border:2px solid #d8d8e8;border-radius:10px;font-family:inherit}textarea{font-size:15px;min-height:70px}
.btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;background:#2e2d6e;color:#fff;margin-top:10px}.btn.sec{background:#fff;color:#2e2d6e;border:2px solid #2e2d6e}
.btn:disabled{opacity:.5}.err{color:#c62828;font-weight:700;margin-top:8px}.muted{color:#666;font-size:13px}
.score{position:sticky;top:0;z-index:5;background:#2e2d6e;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between}
details{background:#f6f6fb;border-radius:10px;padding:10px;margin-top:8px}summary{font-weight:800;color:#2e2d6e;cursor:pointer}
.al{border-top:1px solid #e3e3ef;padding-top:10px;margin-top:10px}.al .n{font-weight:800;font-size:14px;margin-bottom:4px}
.stars{display:flex;gap:6px}.stars button{flex:1;font-size:26px;background:#fff;border:2px solid #d8d8e8;border-radius:10px;padding:6px 0;color:#ccc}.stars button.on{color:#f5a700;border-color:#f5a700}
.done{text-align:center;padding:30px 10px}.done .big{font-size:54px}
</style></head><body>
<div class="top"><small>Bancas de PFC 2026/2 · Engenharia de Software</small><h1 id="ttl">Carregando…</h1></div>
<div class="wrap" id="app"><div class="card muted">Carregando…</div></div>
<script>
var API='https://script.google.com/macros/s/AKfycbwH42RqPu3YP9BKmb3iNq8xf8HUcdNDOl6otj6ugBwZtuCxXPSgaYYd0k-JGdEBuoGb/exec';
function _call(fn,args){return fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j.result})}
var google={script:{get run(){var ok=function(){},fail=function(e){alert(e.message||e)};var p=new Proxy({},{get:function(t,k){if(k==='withSuccessHandler')return function(f){ok=f;return p};if(k==='withFailureHandler')return function(f){fail=f;return p};return function(){var a=[].slice.call(arguments);_call(k,a).then(ok,function(e){if(String(e.message||e).indexOf('Failed to fetch')>=0||e.name==='TypeError')e=new Error('Sem conexão com a internet. Tente de novo.');fail(e)})}}});return p}}};
function _q(){var u=new URLSearchParams(location.search),q={};u.forEach(function(v,k){q[k]=v});var o={};
 if(q.s||q.sala)o.sala=q.s||q.sala;
 var d=q.d||q.data;if(d)o.data=/^\d{1,2}$/.test(d)?'2026-12-'+('0'+d).slice(-2):d;
 var t=q.t||q.turno;if(t)o.turno=/^n/i.test(t)?'Noturno':/^m/i.test(t)?'Matutino':t;
 var m=q.m||q.modo;if(m)o.modo=/^a/i.test(m)?'aluno':/^d/i.test(m)?'doc':m;
 if(q.b)o.b=q.b;return o}
</script>
<script>
var Q=_q(), D=null, MAT=localStorage.getItem('pfc_mat')||'', L={E:'Excelente',B:'Bom',R:'Regular',I:'Insuficiente'}, NV={E:1,B:.8,R:.6,I:.3};
var $=function(h){document.getElementById('app').innerHTML=h;window.scrollTo(0,0)}, T=function(t){document.getElementById('ttl').textContent=t};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function run(fn,args,ok){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){alert(String(e.message||e).replace(/^Error:\s*/,''))});r[fn].apply(r,args)}
function nowMin(b){var n=new Date();var dd=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');if(dd!==b.data)return false;var m=n.getHours()*60+n.getMinutes();var a=b.hora.split('–');var s=+a[0].slice(0,2)*60+ +a[0].slice(3,5),e=+a[1].slice(0,2)*60+ +a[1].slice(3,5);return m>=s-5&&m<e}
run('apiBancas',[],function(d){D=d;route()});
function route(){var m=Q.modo||'prof';if(m==='doc')return docLogin();if(Q.b)return m==='aluno'?alunoForm(byId(Q.b)):profLogin(byId(Q.b),'apresentacao');lista(m)}
function byId(id){return D.bancas.filter(function(b){return b.id===id})[0]}
function lista(m){var bs=D.bancas.filter(function(b){return(!Q.sala||b.sala===Q.sala)&&(!Q.data||b.data===Q.data)&&(!Q.turno||b.turno===Q.turno)});
 var f=bs[0];T(f?('Sala '+(Q.sala||'')+' · '+f.dia+' · '+f.turno):'Bancas');
 var h='<div class="card muted">'+(m==='aluno'?'Toque na banca que você assistiu para avaliar a apresentação. Não precisa se identificar.':'Toque na banca para avaliar. A banca do horário atual aparece em amarelo.')+'</div>';
 bs.forEach(function(b){var done=m==='aluno'&&localStorage.getItem('pfc_al_'+b.id);h+='<div class="card banca'+(nowMin(b)?' now':'')+'" onclick="go(\''+b.id+'\',\''+m+'\')"><div class="hora">'+b.hora.slice(0,5)+'</div><div><div class="g">'+esc(b.grupo)+(nowMin(b)?'<span class="tag">AGORA</span>':'')+(done?'<span class="ok">avaliada</span>':'')+'</div><div class="s">'+b.periodo+' período · Orientador: '+esc(b.orientador)+'</div></div></div>'});
 if(!bs.length)h+='<div class="card">Nenhuma banca encontrada para este QR code.</div>';$(h)}
function go(id,m){var b=byId(id);if(m==='aluno')alunoForm(b);else profLogin(b,'apresentacao')}
function head(b){return '<div class="card"><h2>'+esc(b.grupo)+'</h2><div class="s">'+b.dia+' · '+b.hora+' · Sala '+b.sala+' · '+b.periodo+' período</div><div class="s">Orientador: '+esc(b.orientador)+' · Avaliadores: '+esc(b.avaliadores.join(' e '))+'</div><div class="s">Alunos: '+esc(b.alunos.join(', '))+'</div></div>'}
function profLogin(b,tipo){T(tipo==='documento'?'Avaliação do documento':'Avaliação da apresentação');
 $(head(b)+'<div class="card"><h3>Digite sua matrícula de professor</h3><input id="mat" inputmode="numeric" value="'+esc(MAT)+'" placeholder="Ex.: 12345"><div id="er" class="err"></div><button class="btn" onclick="entrar(\''+b.id+'\',\''+tipo+'\')">Entrar</button><button class="btn sec" onclick="back()">Voltar</button></div>')}
function back(){if(Q.modo==='doc')return docLogin();if(Q.b&&!Q.sala){Q.b=null}lista(Q.modo||'prof')}
function entrar(id,tipo){var m=document.getElementById('mat').value.trim();if(!m)return;document.getElementById('er').textContent='Conferindo…';
 run('apiLogin',[m,id],function(r){if(!r.ok){document.getElementById('er').textContent=r.msg;return}MAT=m;localStorage.setItem('pfc_mat',m);form(byId(id),tipo,r)})}
var S=null;
function form(b,tipo,r){var ant=(r.anteriores||{})[tipo]||{};S={b:b,tipo:tipo,crit:Object.assign({},ant.criterios||{}),pa:JSON.parse(JSON.stringify(ant.porAluno||{})),rec:ant.recomendacao||'',obs:ant.observacao||''};
 T(tipo==='documento'?'Avaliação do documento':'Avaliação da apresentação');
 var h='<div class="score"><span>'+esc(r.nome.split(' ')[0])+' · '+r.papel+'</span><span id="sc"></span></div>'+head(b);
 if(ant.criterios)h+='<div class="card muted">Você já avaliou esta parte. Se enviar de novo, a avaliação anterior é substituída.</div>';
 if(tipo==='documento'){h+='<div class="card"><h3>Documento final (30 pontos)</h3>'+D.criterios.DOC.map(cr).join('')+'</div>'}
 else{h+='<div class="card"><h3>Apresentação do grupo (30 pontos)</h3>'+D.criterios.ORAL_G.map(cr).join('')+D.criterios.ORAL_I.map(cr).join('')+
  '<details'+(Object.keys(S.pa).length?' open':'')+'><summary>Ajustar a nota de algum aluno (opcional)</summary><div class="muted" style="margin-top:6px">Por padrão, todos recebem a nota do grupo em domínio e arguição. Mude só quem teve desempenho diferente.</div>'+
  b.alunos.map(function(a,i){return '<div class="al"><div class="n">'+esc(a)+'</div>'+D.criterios.ORAL_I.map(function(c){return '<div class="muted">'+c[1]+'</div>'+opts('pa'+i+'_'+c[0],(S.pa[a]||{})[c[0]]||'')}).join('')+'</div>'}).join('')+'</details></div>'+
  '<div class="card"><h3>Recomendação final</h3><div class="rec">'+['Aprovado','Aprovado com ajustes','Reprovado'].map(function(x){return '<button data-r="'+x+'" class="'+(S.rec===x?'on':'')+'" onclick="rec(this)">'+x+'</button>'}).join('')+'</div></div>'}
 h+='<div class="card"><h3>Observações (opcional)</h3><textarea id="obs" placeholder="Ajustes pedidos, comentários para o grupo…">'+esc(S.obs)+'</textarea><div id="er" class="err"></div><button class="btn" id="env" onclick="enviar()">Enviar avaliação</button>'+(tipo==='apresentacao'?'<button class="btn sec" onclick="form(S.b,\'documento\','+esc(JSON.stringify(r)).replace(/'/g,"\\'")+')">Avaliar o documento deste grupo</button>':'')+'<button class="btn sec" onclick="back()">Voltar</button></div>';
 $(h);score()}
function cr(c){return '<div class="crit"><div class="l">'+c[1]+' <span>('+c[2]+' pts)</span></div>'+opts(c[0],S.crit[c[0]]||'')+'</div>'}
function opts(k,v){return '<div class="opts" data-k="'+k+'">'+['I','R','B','E'].map(function(x){return '<button class="'+x+(v===x?' on':'')+'" onclick="pick(this,\''+k+'\',\''+x+'\')">'+L[x]+'</button>'}).join('')+'</div>'}
function pick(el,k,x){[].forEach.call(el.parentNode.children,function(c){c.classList.remove('on')});el.classList.add('on');
 var m=k.match(/^pa(\d+)_(.+)$/);if(m){var a=S.b.alunos[+m[1]];S.pa[a]=S.pa[a]||{};S.pa[a][m[2]]=x}else S.crit[k]=x;score()}
function rec(el){[].forEach.call(el.parentNode.children,function(c){c.classList.remove('on')});el.classList.add('on');S.rec=el.getAttribute('data-r')}
function score(){var list=S.tipo==='documento'?D.criterios.DOC:D.criterios.ORAL_G.concat(D.criterios.ORAL_I);var p=list.reduce(function(s,c){return s+c[2]*(NV[S.crit[c[0]]]||0)},0);var n=list.filter(function(c){return S.crit[c[0]]}).length;document.getElementById('sc').textContent='Grupo: '+p.toFixed(1)+' / 30'+(n<list.length?' ('+n+'/'+list.length+')':'')}
function enviar(){S.obs=document.getElementById('obs').value;var btn=document.getElementById('env');btn.disabled=true;btn.textContent='Enviando…';
 google.script.run.withSuccessHandler(function(){T('Avaliação enviada');$('<div class="card done"><div class="big">✅</div><h2>Avaliação enviada!</h2><p class="muted">'+esc(S.b.grupo)+' · '+(S.tipo==='documento'?'documento':'apresentação')+'</p><button class="btn" onclick="back()">Voltar para as bancas</button></div>')})
 .withFailureHandler(function(e){btn.disabled=false;btn.textContent='Enviar avaliação';document.getElementById('er').textContent=String(e.message||e).replace(/^Error:\s*/,'')})
 .apiEnviarProfessor({banca:S.b.id,tipo:S.tipo,matricula:MAT,criterios:S.crit,porAluno:S.pa,recomendacao:S.rec,observacao:S.obs})}
function docLogin(){T('Avaliação dos documentos');$('<div class="card"><h3>Digite sua matrícula de professor</h3><div class="muted">Aqui você avalia o documento final dos grupos das suas bancas, antes da apresentação.</div><br><input id="mat" inputmode="numeric" value="'+esc(MAT)+'"><div id="er" class="err"></div><button class="btn" onclick="docEntrar()">Entrar</button></div>')}
function docEntrar(){var m=document.getElementById('mat').value.trim();if(!m)return;document.getElementById('er').textContent='Conferindo…';run('apiLogin',[m,null],function(r){if(!r.ok){document.getElementById('er').textContent=r.msg;return}MAT=m;localStorage.setItem('pfc_mat',m);T('Olá, '+r.nome.split(' ')[0]);
 $('<div class="card muted">Estas são as suas bancas. Toque no grupo para avaliar o documento.</div>'+r.bancas.map(function(b){return '<div class="card banca" onclick="profLogin(byId(\''+b.id+'\'),\'documento\');setTimeout(function(){entrar(\''+b.id+'\',\'documento\')},50)"><div class="hora">'+b.dia.slice(4)+'<br><span class="s">'+b.hora.slice(0,5)+'</span></div><div><div class="g">'+esc(b.grupo)+'</div><div class="s">'+b.papel+' · Sala '+b.sala+'</div></div></div>'}).join(''))})}
var AS={};
function alunoForm(b){T('Avalie a apresentação');if(localStorage.getItem('pfc_al_'+b.id)){$(head(b)+'<div class="card done"><div class="big">✅</div><h2>Você já avaliou esta banca</h2><button class="btn" onclick="lista(\'aluno\')">Voltar</button></div>');return}AS={b:b};
 var qs=[['clareza','A apresentação foi clara e organizada?'],['sistema','O sistema funcionou bem na demonstração?'],['dominio','O grupo mostrou domínio do projeto?']];
 $(head(b)+'<div class="card"><div class="muted">Sua avaliação é anônima. De 1 (fraco) a 5 (excelente).</div>'+qs.map(function(q){return '<div class="crit"><div class="l">'+q[1]+'</div><div class="stars" data-k="'+q[0]+'">'+[1,2,3,4,5].map(function(n){return '<button onclick="star(this,\''+q[0]+'\','+n+')">★</button>'}).join('')+'</div></div>'}).join('')+
 '<div class="crit"><div class="l">Comentário (opcional)</div><textarea id="com"></textarea></div><div id="er" class="err"></div><button class="btn" id="env" onclick="enviarAluno()">Enviar</button><button class="btn sec" onclick="lista(\'aluno\')">Voltar</button></div>')}
function star(el,k,n){AS[k]=n;[].forEach.call(el.parentNode.children,function(c,i){c.classList.toggle('on',i<n)})}
function enviarAluno(){var btn=document.getElementById('env');if(!(AS.clareza&&AS.sistema&&AS.dominio)){document.getElementById('er').textContent='Responda as 3 perguntas.';return}btn.disabled=true;btn.textContent='Enviando…';
 google.script.run.withSuccessHandler(function(){localStorage.setItem('pfc_al_'+AS.b.id,'1');$('<div class="card done"><div class="big">🙌</div><h2>Obrigado pela avaliação!</h2><button class="btn" onclick="lista(\'aluno\')">Avaliar outra banca</button></div>')})
 .withFailureHandler(function(e){btn.disabled=false;btn.textContent='Enviar';document.getElementById('er').textContent=String(e.message||e).replace(/^Error:\s*/,'')})
 .apiEnviarAluno({banca:AS.b.id,clareza:AS.clareza,sistema:AS.sistema,dominio:AS.dominio,comentario:document.getElementById('com').value})}
</script></body></html>
